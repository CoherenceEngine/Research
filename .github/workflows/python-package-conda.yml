name: Research evidence checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q validation replays
      - name: Test portfolio evidence auditors
        run: python -m unittest discover -s validation -p 'test_*.py' -v
      - name: Test Scania decision-ledger auditor
        run: python -m unittest discover -s validation/scania_v1 -p 'test_*.py' -v
      - name: Audit released evidence integrity and arithmetic
        run: python validation/audit.py all
      - name: Verify replay artifacts and archived outputs
        run: python replays/check_replays.py
